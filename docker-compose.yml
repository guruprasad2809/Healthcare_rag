# Optional: run Qdrant as a server instead of embedded local storage.
#   docker compose up -d      then set QDRANT_URL=http://localhost:6333 in .env
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  qdrant_data:
